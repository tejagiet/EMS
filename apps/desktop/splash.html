<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management System (EMS) - Launching</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 440px;
      width: 90%;
      animation: fadeIn 0.6s ease-out forwards;
    }
    .logo-wrapper {
      position: relative;
      margin-bottom: 24px;
    }
    .pulse-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
      border: 2px solid rgba(59, 130, 246, 0.4);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 3px solid #3b82f6;
      box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.5);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(51, 65, 85, 0.6);
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 16px;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 9999px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
    }
    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <div class="pulse-ring"></div>
      <img src="logo.jpg" alt="GIET EMS Logo" class="logo" onerror="this.src='icon.png'" />
    </div>

    <div>
      <span class="badge">GIET Polytechnic College · AI Dept</span>
    </div>

    <h1>Employee Management System</h1>
    <p class="subtitle">Secure Desktop Workspace</p>

    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <div class="status-text">
      <span id="statusLabel">Initializing workspace</span><span class="dots"></span>
    </div>
  </div>

  <script>
    const progressBar = document.getElementById("progressBar");
    const statusLabel = document.getElementById("statusLabel");

    let progress = 10;
    progressBar.style.width = progress + "%";

    const stages = [
      { at: 25, label: "Loading institutional security modules" },
      { at: 60, label: "Verifying portal credentials" },
      { at: 85, label: "Opening login console" },
      { at: 100, label: "Ready" }
    ];

    let currentStageIndex = 0;
    const interval = setInterval(() => {
      if (currentStageIndex < stages.length) {
        const stage = stages[currentStageIndex];
        progressBar.style.width = stage.at + "%";
        statusLabel.textContent = stage.label;
        currentStageIndex++;
      } else {
        clearInterval(interval);
        setTimeout(() => {
          if (window.emsDesktop && window.emsDesktop.onSplashReady) {
            window.emsDesktop.onSplashReady();
          }
        }, 300);
      }
    }, 400);
  </script>
</body>
</html>
